name: Despliegue Backend en VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/despliegue-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: despliegue-backend-produccion
  cancel-in-progress: true

jobs:
  validar:
    name: Validar backend Django
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar chequeo de Django
        working-directory: backend
        run: python manage.py check

  desplegar:
    name: Desplegar en VPS
    runs-on: ubuntu-latest
    needs: validar
    environment: backend-env
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: mostrar clave ssh
        run: echo "${{ secrets.VPS_SSH_KEY }}"

      - name: mostrar host
        run: echo "${{ secrets.VPS_HOST }}"

      - name: mostrar usuario
        run: echo "${{ secrets.VPS_USER }}"
      
      - name: probar ssh
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT || 22 }} -i <(echo "${{ secrets.VPS_SSH_KEY }}") ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "echo 'SSH connection successful'"
      


      - name: Subir archivos del backend a la VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "backend,requirements.txt,docker-compose.yml,.dockerignore"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Levantar backend con Docker Compose en la VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOW_ALL_ORIGINS: ${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SQLITE_PATH: ${{ secrets.SQLITE_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DJANGO_SECRET_KEY,DEBUG,ALLOWED_HOSTS,CORS_ALLOW_ALL_ORIGINS,CORS_ALLOWED_ORIGINS,SQLITE_PATH
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"

            umask 177
            cat > .env <<EOF
            DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
            DEBUG=${DEBUG}
            ALLOWED_HOSTS=${ALLOWED_HOSTS}
            CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            SQLITE_PATH=${SQLITE_PATH}
            EOF

            docker compose up -d --build backend
            docker compose ps
