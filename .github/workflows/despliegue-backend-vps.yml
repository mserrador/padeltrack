name: Despliegue Backend en VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - ".dockerignore"
      - ".github/workflows/despliegue-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: despliegue-backend-produccion
  cancel-in-progress: true

jobs:
  validar:
    name: Validar backend Django
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar chequeo de Django
        working-directory: backend
        run: python manage.py check

  desplegar:
    name: Desplegar en VPS
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Subir archivos del backend a la VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "backend,requirements.txt,docker-compose.yml,.dockerignore"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Levantar backend con Docker Compose en la VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"

            if [ ! -f .env ]; then
              echo "ERROR: Falta el archivo .env en ${{ secrets.VPS_APP_DIR }}"
              exit 1
            fi

            docker compose up -d --build backend
            docker compose ps
