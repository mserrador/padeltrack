name: Despliegue PadelTrack VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "requirements.txt"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".dockerignore"
      - ".github/workflows/despliegue-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: despliegue-padeltrack-produccion
  cancel-in-progress: true

jobs:
  validar-backend:
    name: Validar backend Django
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar chequeo de Django
        working-directory: backend
        run: python manage.py check

  build-frontend:
    name: Build frontend React
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/
        run: npm run build

  desplegar:
    name: Desplegar backend y frontend en VPS
    runs-on: ubuntu-latest
    needs: [validar-backend, build-frontend]
    environment: backend-env
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend para despliegue
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/
        run: npm run build
      
      - name: Subir archivos a la VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "backend,frontend/dist,requirements.txt,docker-compose.yml,Caddyfile,.dockerignore"
          target: ${{ secrets.VPS_APP_DIR }}
          overwrite: true

      - name: Levantar stack backend + frontend en la VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          CORS_ALLOW_ALL_ORIGINS: ${{ secrets.CORS_ALLOW_ALL_ORIGINS }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SQLITE_PATH: ${{ secrets.SQLITE_PATH }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DJANGO_SECRET_KEY,DEBUG,ALLOWED_HOSTS,CORS_ALLOW_ALL_ORIGINS,CORS_ALLOWED_ORIGINS,SQLITE_PATH,APP_DOMAIN,EMAIL_HOST,EMAIL_PORT,EMAIL_HOST_USER,EMAIL_HOST_PASSWORD,EMAIL_USE_TLS,DEFAULT_FROM_EMAIL,FRONTEND_URL
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"

            export DOCKER_CONFIG="${{ secrets.VPS_APP_DIR }}/.docker-ci"
            export BUILDX_CONFIG="${DOCKER_CONFIG}/buildx"
            mkdir -p "${DOCKER_CONFIG}" "${BUILDX_CONFIG}/activity" "${BUILDX_CONFIG}/defaults" "${BUILDX_CONFIG}/instances"
            chmod -R 700 "${DOCKER_CONFIG}"

            umask 177
            cat > .env <<EOF
            DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
            DEBUG=${DEBUG}
            ALLOWED_HOSTS=${ALLOWED_HOSTS}
            CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS}
            CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
            SQLITE_PATH=${SQLITE_PATH}
            APP_DOMAIN=${APP_DOMAIN}
            EMAIL_HOST=${EMAIL_HOST}
            EMAIL_PORT=${EMAIL_PORT}
            EMAIL_HOST_USER=${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
            EMAIL_USE_TLS=${EMAIL_USE_TLS}
            DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
            FRONTEND_URL=${FRONTEND_URL}
            EOF

            DOCKER_BUILDKIT=0 docker build -f backend/Dockerfile -t padeltrack-backend:latest .
            docker compose up -d --no-build --force-recreate
            docker compose ps
