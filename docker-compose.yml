services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: padeltrack-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend/data:/app/backend/data

  caddy:
    image: caddy:2
    container_name: padeltrack-caddy
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
